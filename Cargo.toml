[workspace]
resolver = "2"
members = [
  "crates/opentartarus-core",
  "crates/opentartarus-daemon",
  "crates/opentartarus-ui",
  "crates/opentartarus-fix-permissions",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"
version = "0.1.0"
authors = ["PikkonMG <pikkons@gmail.com>"]
repository = "https://github.com/PikkonMG/opentartarus"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
