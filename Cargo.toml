[workspace]
resolver = "2"
members = [
  "crates/opentartarus-core",
  "crates/opentartarus-daemon",
  "crates/opentartarus-ui",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
