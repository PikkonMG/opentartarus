# Runs the formatter check, the tests and clippy on every push and pull
# request to main. The release workflow runs the same tests again before it
# publishes. All three gates are clean on main, so any failure here is
# something the change introduced.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # The same runner the release uses, so a green CI means a green release.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt

      # Only the downloaded crates are cached, never target/. A restored
      # target/ makes clippy skip crates it has already linted, which would
      # hide new warnings.
      - name: Cache the crate downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
